services:
  spark-master:
    image: spark-iceberg:3.5.6
    container_name: spark-master
    hostname: spark-master
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./spark-logs:/opt/spark/logs
      - ./spark/conf:/opt/spark/conf
    command: >
       /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master
    networks:
      - spark-network

  spark-worker:
    image: spark-iceberg:3.5.6
    container_name: spark-worker
    hostname: spark-worker
    volumes:
      - ./spark-logs:/opt/spark/logs
      - ./spark/conf:/opt/spark/conf
    ports:
      - "8081:8081"
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker --host localhost spark://spark-master:7077
    depends_on:
      - spark-master
    networks:
      - spark-network

  minio:
    image: minio/minio
    container_name: minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
      - MINIO_DOMAIN=minio
    hostname: minio
    networks:
      spark-network:
    ports:
      - 9001:9001
      - 9000:9000
    command: ["server", "/data", "--console-address", ":9001"]

  mc:
    depends_on:
      - minio
    image: minio/mc
    container_name: mc
    networks:
      spark-network:
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    entrypoint: |
      /bin/sh -c "
      until (/usr/bin/mc alias set minio http://minio:9000 admin password) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc rm -r --force minio/warehouse;
      /usr/bin/mc mb minio/warehouse;
      /usr/bin/mc policy set public minio/warehouse;
      tail -f /dev/null
      "

  trino:
    image: trinodb/trino:476
    container_name: trino
    ports:
      - "8082:8080"
    volumes:
      - ./trino/etc:/etc/trino
    networks:
      spark-network:

  catalog:
    image: apache/iceberg-rest-fixture:1.9.2
    container_name: catalog
    networks:
      spark-network:
    ports:
      - 8181:8181
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
      - CATALOG_WAREHOUSE=s3a://warehouse/
      - CATALOG_IO__IMPL=org.apache.iceberg.aws.s3.S3FileIO
      - CATALOG_S3_ENDPOINT=http://minio:9000

networks:
  spark-network:
    driver: bridge
      